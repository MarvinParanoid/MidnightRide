name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The one beacon a session sends, if anywhere to send it. Not a secret:
      # it is a public endpoint that accepts writes by design, and the address
      # ends up in the shipped bundle where anyone can read it — hiding it in
      # the repository settings would protect nothing and would mean a build
      # that quietly stops reporting the day someone forgets to set it.
      - run: npm run build
        env:
          VITE_TELEMETRY_URL: https://midnight-ride-telemetry.marvinparanoid.workers.dev/c
      # Pages must already be enabled with "GitHub Actions" as the source:
      # Settings -> Pages -> Build and deployment -> Source. The workflow token
      # is not allowed to create the site itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
